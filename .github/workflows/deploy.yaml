name: Docker Project Deploy

on:
  push:
    branches:
      - main

jobs:
  build_and_push_to_docker_hub:
    name: Build and push images to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Backend to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./backend/
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/docker-project-backend:latest
            ${{ secrets.DOCKER_USER }}/docker-project-backend:${{ github.sha }}

      - name: Push Frontend to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./frontend/
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/docker-project-frontend:latest
            ${{ secrets.DOCKER_USER }}/docker-project-frontend:${{ github.sha }}

  security_scan:
    name: Scan images with Trivy
    runs-on: ubuntu-latest
    if: false
    needs: build_and_push_to_docker_hub
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Run Trivy on backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USER }}/docker-project-backend:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy on frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USER }}/docker-project-frontend:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  run-with-docker-compose:
    name: Run with Docker Compose
    runs-on: ubuntu-latest
    needs: [build_and_push_to_docker_hub, security_scan]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Start containers
        run: docker compose up -d --build

      - name: Wait for services
        run: sleep 15

      - name: Check containers status
        run: docker compose ps

      - name: Check backend health
        run: |
          docker compose exec -T backend wget -qO- http://localhost:8081/health || exit 1

      - name: Check frontend availability
        run: |
          curl -f http://localhost:80 || exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v