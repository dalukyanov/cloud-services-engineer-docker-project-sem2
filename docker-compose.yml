secrets:
  api_key_secret:
    file: ./secrets/api_key.txt

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      - PORT=8081
      - API_KEY_FILE=/run/secrets/api_key_secret
    networks:
      - app-network
    volumes:
      - backend-logs:/app/logs
    secrets:
      - api_key_secret
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    # Security policies
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "80:8080"
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - frontend-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    cap_drop:
      - ALL
    read_only: true
    # Grant privileges to nginx user
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp:uid=101,gid=101,mode=1777

networks:
  app-network:
    driver: bridge

volumes:
  backend-logs:
    driver: local
  frontend-logs:
    driver: local