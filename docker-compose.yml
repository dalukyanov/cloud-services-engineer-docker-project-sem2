version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: app-backend
    restart: unless-stopped
    environment:
      - PORT=8081
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    cap_drop:
      - ALL

  frontend:
    build:
      context: ./frontend
    container_name: app-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    cap_drop:
      - ALL

networks:
  app-network:
    driver: bridge