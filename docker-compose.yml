secrets:
  api_key_secret:
    file: ./secrets/api_key.txt

services:
  proxy:
    image: nginxinc/nginx-unprivileged:alpine
    restart: unless-stopped
    ports:
      - "80:8080"
    networks:
      - app-network
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /var/log/nginx:uid=101,gid=101,mode=0755
      - /tmp:uid=101,gid=101,mode=1777

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      - PORT=8081
      - API_KEY_FILE=/run/secrets/api_key_secret
    networks:
      - app-network
    volumes:
      - backend-logs:/app/logs
    secrets:
      - api_key_secret
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    networks:
      - app-network
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - frontend-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp:uid=101,gid=101,mode=1777

networks:
  app-network:
    driver: bridge

volumes:
  backend-logs:
    driver: local
  frontend-logs:
    driver: local